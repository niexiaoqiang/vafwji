services:
  airplane-game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airplane-game
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # 社区微应用鉴权（/mini-app/ws 校验平台 JWT）。部署到公网并在社区上架时填写：
      # - MINI_APP_ISSUER=https://linux.do           # 社区基地址，含子目录，不以 / 结尾
      # - MINI_APP_ID=社区应用页分配的应用ID
      # - MINI_APP_PUBLIC_ORIGIN=https://zha-fei-ji.onrender.com  # 本服务对外 HTTPS 地址
      # - MINI_APP_CHANNELS=production,sandbox       # 沙箱调试时加入 sandbox
    restart: unless-stopped
    networks:
      - airplane-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/healthz', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  airplane-network:
    driver: bridge 